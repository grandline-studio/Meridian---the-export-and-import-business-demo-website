<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Meridian Exim — export & import partner moving India's finest goods to 60+ countries." />
    <meta name="theme-color" content="#06080f" />
    <script>
      // pick the theme before first paint: saved choice, else the device setting
      (function () {
        var t
        try { t = localStorage.getItem('theme') } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.dataset.theme = t
        document.querySelector('meta[name="theme-color"]').content = t === 'light' ? '#f2efe8' : '#06080f'
      })()
    </script>
    <link rel="preload" href="/land.json" as="fetch" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- fonts load without blocking first paint (text shows in the fallback font, then swaps) -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&family=Newsreader:ital,opsz,wght@1,6..72,300..500&family=IBM+Plex+Mono:wght@400;500&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&family=Newsreader:ital,opsz,wght@1,6..72,300..500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&family=Newsreader:ital,opsz,wght@1,6..72,300..500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" /></noscript>
    <title>Meridian Exim — Global Export & Import</title>
    <style>
      /* static loading screen painted before any JS arrives; the React preloader takes over from it */
      html, body { margin: 0; background: #06080f; }
      #boot { position: fixed; inset: 0; z-index: 101; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0b0f1a; color: #ece8df; font-family: Archivo, ui-sans-serif, system-ui, sans-serif; }
      #boot .k { font: 11px/1 "IBM Plex Mono", ui-monospace, monospace; letter-spacing: .3em; text-transform: uppercase; color: #8b91a1; }
      #boot .n { margin-top: 24px; font-size: clamp(4rem, 14vw, 10rem); font-weight: 500; line-height: 1; letter-spacing: -0.05em; }
      #boot .b { position: relative; overflow: hidden; margin-top: 24px; width: 256px; height: 1px; background: rgba(255,255,255,.1); }
      #boot .b::after { content: ""; position: absolute; inset: 0; width: 30%; background: #ff6b2c; animation: boot 1.1s ease-in-out infinite; }
      html[data-theme='light'], html[data-theme='light'] body { background: #f2efe8; }
      html[data-theme='light'] #boot { background: #fbfaf7; color: #15171d; }
      html[data-theme='light'] #boot .b { background: rgba(0,0,0,.1); }
      @keyframes boot { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true"><div class="k">Loading manifest</div><div class="n">000</div><div class="b"></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
